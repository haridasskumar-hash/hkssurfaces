<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 515" role="img" aria-labelledby="title desc">
  <title id="title">Green EPDM rubber granules</title>
  <desc id="desc">Premium green EPDM rubber granules for wet-pour flooring, with colorful granules in the background and product benefits below.</desc>
  <defs>
