    <pattern id="brown" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r="4" fill="#5c3722"/><circle cx="15" cy="5" r="4" fill="#815233"/><circle cx="10" cy="15" r="4" fill="#4b2d1c"/><circle cx="19" cy="16" r="3" fill="#6e4229"/></pattern>
